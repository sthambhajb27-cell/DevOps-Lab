apiVersion: apps/v1
kind: Deployment
metadata:
  name: treasurebook-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: treasurebook-api
  template:
    metadata:
      labels:
        app: treasurebook-api
    spec:
      containers:
      - name: treasurebook-api
        image: treasurebook-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/"
---
apiVersion: v1
kind: Service
metadata:
  name: treasurebook-service
spec:
  type: NodePort
  selector:
    app: treasurebook-api
  ports:
    - port: 80
      targetPort: 5000
